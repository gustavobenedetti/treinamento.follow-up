<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cadência de Follow-up</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a16;--surface:#0b1530;--surface2:#101f42;--line:#1b2c52;--line2:#26396a;--fg:#eaf0ff;--muted:#9fb0d2;--faint:#6f7fa3;--brand:#3b82f6;--brand-ink:#7fb0ff;
--c1:#3b82f6;--c2:#22b8e0;--c3:#a78bfa;--c4:#f59e0b;--c5:#22c55e;--c6:#f472b6;--c7:#2dd4bf;
--display:'Inter Tight','Inter','Segoe UI',system-ui,sans-serif;--body:'Inter','Segoe UI',system-ui,sans-serif;--mono:'Inter','Segoe UI',system-ui,sans-serif;
--nav-h:52px;--bar-h:56px;--gl:max(16px,env(safe-area-inset-left));--gr:max(16px,env(safe-area-inset-right));color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--body);font-variant-numeric:tabular-nums;color:var(--fg);-webkit-font-smoothing:antialiased;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px}

/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:200;height:calc(var(--nav-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) var(--gr) 0 var(--gl);display:flex;align-items:center;justify-content:space-between;background:rgba(5,10,22,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
nav img{height:24px;display:block}
.counter{font-family:var(--mono);font-size:11px;color:var(--faint)}
.progress{position:fixed;top:calc(var(--nav-h) + env(safe-area-inset-top));left:0;right:0;z-index:200;height:2px;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:var(--brand);box-shadow:0 0 10px var(--brand);transition:width .4s ease}

/* deck */
.deck{position:fixed;top:calc(var(--nav-h) + env(safe-area-inset-top) + 2px);bottom:calc(var(--bar-h) + env(safe-area-inset-bottom));left:0;right:0;overflow:hidden;background-image:radial-gradient(800px 420px at 85% -10%,rgba(59,130,246,.16),transparent 60%),radial-gradient(600px 360px at -10% 100%,rgba(34,184,224,.07),transparent 60%)}
.grid-bg{position:absolute;inset:0;pointer-events:none;opacity:.05;background-image:linear-gradient(rgba(127,176,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(127,176,255,.5) 1px,transparent 1px);background-size:56px 56px}
.slide{position:absolute;inset:0;display:flex;padding:26px var(--gr) 26px var(--gl);opacity:0;visibility:hidden;pointer-events:none;transform:translateX(40px);transition:opacity .4s ease,transform .4s ease,visibility 0s .4s;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.slide::-webkit-scrollbar{display:none}
.slide.before{transform:translateX(-40px)}
.slide.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition-delay:0s}
@media(min-width:768px){.slide{padding:24px max(64px,var(--gr)) 30px max(64px,var(--gl))}}
.in{margin:auto;width:100%;max-width:1000px;position:relative;z-index:1}
.ai{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s ease}
.slide.active .ai{opacity:1;transform:none}
.slide.active .ai:nth-child(1){transition-delay:.05s}.slide.active .ai:nth-child(2){transition-delay:.13s}.slide.active .ai:nth-child(3){transition-delay:.21s}.slide.active .ai:nth-child(4){transition-delay:.29s}.slide.active .ai:nth-child(5){transition-delay:.37s}.slide.active .ai:nth-child(6){transition-delay:.45s}

/* atoms */
.eyebrow{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--cc,var(--brand-ink));margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.eyebrow::before{content:"";width:22px;height:1px;background:currentColor;opacity:.6}
h2{font-family:var(--display);font-weight:600;letter-spacing:-.02em;line-height:1.1;font-size:clamp(26px,4.6vw,48px)}
h2 em{font-style:normal;color:var(--brand-ink)}
.sub{color:var(--muted);font-size:clamp(15px,2.2vw,18px);max-width:60ch;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;position:relative;overflow:hidden}
.card h4{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:12px}

/* cover */
.cover{text-align:center;display:flex;flex-direction:column;align-items:center}
.cover img{height:clamp(34px,6vw,52px);margin-bottom:34px}
.cover .kick{font-family:var(--display);font-weight:500;font-size:clamp(12px,2.2vw,16px);letter-spacing:.42em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.cover h1{font-family:var(--display);font-weight:600;font-size:clamp(44px,9vw,92px);line-height:1.02;letter-spacing:-.03em}
.cover h1 em{font-style:normal;background:linear-gradient(100deg,#7fb0ff,#22b8e0);-webkit-background-clip:text;background-clip:text;color:transparent}
.cover p{margin-top:22px;color:var(--muted);font-size:clamp(15px,2.4vw,19px);max-width:46ch}
.hint{margin-top:34px;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em}
.start{margin-top:28px;background:var(--brand);color:#fff;font-family:var(--display);font-weight:600;font-size:15px;padding:13px 26px;border-radius:999px;min-height:46px}

/* s1 */
.four{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}
@media(min-width:768px){.four{grid-template-columns:repeat(4,1fr)}}
.fc{display:flex;flex-direction:column;gap:10px}
.fc .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 14%,transparent);color:var(--cc)}
.fc svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fc b{font-family:var(--display);font-size:16px;font-weight:600;line-height:1.2}
.fc span{color:var(--muted);font-size:14px;line-height:1.45}
.fc::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:var(--cc)}
.focus{margin-top:18px;border:1px solid color-mix(in srgb,var(--brand) 40%,var(--line));background:color-mix(in srgb,var(--brand) 10%,var(--surface));border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:center;font-size:15.5px}
.focus b{font-family:var(--display);color:var(--brand-ink)}

/* s2 map */
.lane{display:grid;grid-template-columns:1fr;gap:10px;align-items:stretch;margin-top:12px}
@media(min-width:768px){.lane{grid-template-columns:130px 1fr}}
.lane-l{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:10px}
.lane-l small{display:block;font-weight:500;letter-spacing:.02em;text-transform:none;font-size:12px;color:var(--faint)}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pchip{text-align:left;display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cc);border-radius:14px;padding:12px 14px;transition:.2s;min-height:60px}
.pchip:hover{background:var(--surface2);transform:translateY(-2px)}
.code{flex:0 0 auto;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,transparent)}
.pchip b{display:block;font-family:var(--display);font-size:15px;font-weight:600;line-height:1.2}
.pchip small{color:var(--muted);font-size:12.5px;line-height:1.35;display:block;margin-top:2px}

/* s3 calendar */
.days{display:flex;gap:8px;margin:22px 0 16px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.days::-webkit-scrollbar{display:none}
.dy{flex:1 1 0;min-width:0;padding:12px 6px;border-radius:14px;border:1px solid var(--line2);font-family:var(--display);font-weight:600;font-size:14px;color:var(--muted);text-align:center;min-height:48px;transition:.2s}
.dy[aria-selected=true]{background:var(--fg);color:#07122a;border-color:var(--fg)}
.dy.mes{border-style:dashed}
.calrows{display:grid;gap:10px}
@media(min-width:768px){.calrows{grid-template-columns:1fr 1fr}}
.opt-t{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--c4);margin:6px 0 0}
.calnote{margin-top:14px;color:var(--faint);font-size:14px}

/* practice slide */
.phead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.phead .code{width:46px;height:46px;font-size:15px;border-radius:13px}
.phead h2{font-size:clamp(26px,4vw,40px)}
.chip{font-family:var(--display);font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;background:color-mix(in srgb,var(--cc) 16%,transparent);color:var(--cc)}
.chip.sg{background:rgba(245,158,11,.14);color:var(--c4)}
.obj{margin-top:10px;color:var(--muted);font-size:clamp(15px,2.2vw,18px);max-width:70ch}
.cols{display:grid;gap:12px;margin-top:14px}
@media(min-width:860px){.cols{grid-template-columns:1fr 1fr}}
.card.pc::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:var(--cc)}
ol.pauta{list-style:none;counter-reset:n;display:grid;gap:8px}
ol.pauta li{counter-increment:n;display:flex;gap:12px;align-items:flex-start;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.45}
ol.pauta li::before{content:counter(n);flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:12px;font-weight:700;background:var(--cc);color:#04101f}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bar{flex:1;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--cc);border-radius:99px;transition:width .3s}
.prog b{font-family:var(--mono);font-size:12px;min-width:34px;text-align:right}
.checks{display:grid;gap:7px}
.ck{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);min-height:46px;font-size:15px;line-height:1.4;transition:.15s}
.ck .box{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);display:grid;place-items:center;transition:.15s}
.ck .box svg{width:14px;height:14px;stroke:#04101f;stroke-width:3;fill:none;opacity:0;transform:scale(.6);transition:.15s}
.ck[aria-checked=true]{border-color:color-mix(in srgb,var(--cc) 55%,var(--line))}
.ck[aria-checked=true] .box{background:var(--cc);border-color:var(--cc)}
.ck[aria-checked=true] .box svg{opacity:1;transform:none}
.ck[aria-checked=true] .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.crit{margin-top:12px;border-left:3px solid var(--cc);background:color-mix(in srgb,var(--cc) 8%,var(--surface));border-radius:0 14px 14px 0;padding:14px 18px;font-size:15.5px}
.crit b{display:block;font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--cc);margin-bottom:4px}
.acts{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;align-items:center}
.lnk{font-size:13px;color:var(--faint);text-decoration:underline;padding:10px 0;min-height:44px}
.pill{font-family:var(--display);font-weight:600;font-size:13px;padding:9px 16px;border-radius:999px;border:1px solid var(--cc);color:var(--cc);min-height:40px}
.ok{display:none;color:var(--cc);font-family:var(--display);font-weight:600;font-size:14px}

/* recap */
.recap{display:grid;gap:10px;width:100%;max-width:760px;margin-top:30px;text-align:left}
@media(min-width:768px){.recap{grid-template-columns:repeat(3,1fr)}}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px;align-content:start}
.rc b{font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600}
.rc button{display:flex;align-items:center;gap:10px;text-align:left;padding:6px;border-radius:10px;font-size:14px;min-height:44px}
.rc button:hover{background:var(--surface2)}
.rc .code{width:32px;height:32px;font-size:11px;border-radius:9px}
.cover .start{margin-top:30px}

/* bottom bar */
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:200;height:calc(var(--bar-h) + env(safe-area-inset-bottom));padding:0 var(--gr) env(safe-area-inset-bottom) var(--gl);display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(5,10,22,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.dots{display:flex;gap:2px;align-items:center;flex-wrap:wrap;max-width:58%}
.dot{width:13px;height:28px;display:grid;place-items:center}
.dot::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--line2);transition:.3s}
.dot.active::after{background:var(--brand);width:14px;border-radius:3px}
.ctl{display:flex;gap:6px}
.arr{width:40px;height:40px;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;font-size:16px;transition:.2s}
.arr:hover{border-color:var(--brand-ink)}
.arr[disabled]{opacity:.35;cursor:default}

/* menu */
#menu{display:none;position:fixed;bottom:calc(var(--bar-h) + env(safe-area-inset-bottom) + 8px);right:var(--gr);z-index:500;background:rgba(5,10,22,.98);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:16px;width:min(320px,calc(100vw - 32px));max-height:68vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.5)}
#menu.open{display:block}
.mh{padding:14px 16px;border-bottom:1px solid var(--line);font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.mi{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 16px;font-size:14px;min-height:44px;color:var(--fg)}
.mi span{font-family:var(--mono);font-size:10px;color:var(--faint);min-width:22px}
.mi.on{background:color-mix(in srgb,var(--brand) 14%,transparent)}
.mi:hover{background:color-mix(in srgb,var(--brand) 8%,transparent)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* follow-up */
.tl{display:flex;gap:8px;margin-top:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.tl::-webkit-scrollbar{display:none}
.tn{flex:1 0 120px;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--cc);border-radius:14px;padding:12px;display:grid;gap:2px;min-height:84px;transition:.2s}
.tn i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 18%,transparent);color:var(--cc);font-family:var(--display);font-size:12px;font-weight:700;margin-bottom:4px}
.tn b{font-family:var(--display);font-size:14px;font-weight:600}
.tn small{color:var(--muted);font-size:12.5px;line-height:1.3}
.tn[aria-pressed=true]{background:color-mix(in srgb,var(--cc) 12%,var(--surface));border-color:var(--cc)}
.er{display:grid;gap:8px}
@media(min-width:720px){.er{grid-template-columns:1fr 1fr}}
.er>div{padding:12px 14px;border-radius:12px;font-size:15px;display:flex;flex-direction:column;gap:2px}
.er span{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.er .no{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25)}.er .no span{color:#f87171}
.er .yes{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25)}.er .yes span{color:#22c55e}
.rc span{color:var(--fg)}

.seq{display:grid;gap:10px;margin-top:22px;align-items:center}
@media(min-width:768px){.seq{grid-template-columns:1fr auto 1fr auto 1fr}}
.arw{font-size:26px;color:var(--faint);text-align:center;line-height:1}
@media(max-width:767px){.arw{transform:rotate(90deg)}}
.dline{margin-top:18px;display:grid;gap:8px}
.dl{font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600}
@media(min-width:768px){.dline .pchip{max-width:50%}}
ul.rg{list-style:none;display:grid;gap:6px}
ul.rg li{font-size:14.5px;color:var(--muted);padding-left:16px;position:relative}
ul.rg li::before{content:"";position:absolute;left:0;top:.7em;width:6px;height:6px;border-radius:50%;background:var(--cc)}
.tctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pre{padding:12px 20px;border-radius:999px;border:1px solid var(--line2);font-family:var(--display);font-weight:600;font-size:14px;color:var(--fg);min-height:46px;transition:.2s}
.pre:hover{background:var(--fg);color:#07122a;border-color:var(--fg)}
#sim{margin-top:20px}

.cat{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--cc);border-radius:16px;padding:18px;display:grid;gap:12px;align-content:start;min-height:100%}
.cat .code{width:38px;height:38px}
.cat b{font-family:var(--display);font-size:clamp(17px,2.4vw,20px);font-weight:600;line-height:1.2}
.tm2{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:2px}
.tm2 small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-family:var(--display);font-weight:600}
.tm2 span{font-family:var(--display);font-size:clamp(18px,2.6vw,22px);font-weight:600;color:var(--cc)}
.tm2 span.tbd{color:var(--c4)}
@media(min-width:768px){.seq{align-items:stretch}.dline .cat{max-width:calc(33.33% - 14px)}}
</style>

  <div class="hint ai">← → teclado · deslize</div>
</div></div>

<div class="slide" id="s1"><div class="in">
  <div class="eyebrow ai">Categorias</div>
  <h2 class="ai">Categorias de follow-up</h2>
  <p class="sub ai">Cada categoria é definida pelo tempo do último diálogo com o lead.</p>
  <div class="seq ai" id="seq"></div>
  <div class="dline ai" id="dline"></div>
</div></div>
</div>

<div class="bottom">
  <div class="dots" id="dots"></div>
  <div class="ctl"><button class="arr" id="prev" aria-label="Anterior">←</button><button class="arr" id="next" aria-label="Próximo">→</button></div>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const TOTAL=2;
const CAT=[
{id:'A',name:'Retomada de diálogo recente',time:'Até 1 dia',col:'--c1'},
{id:'B',name:'Retomada de diálogo perdido',time:'Em até 7 dias',col:'--c2'},
{id:'C',name:'Reativação de base',time:'Sob demanda da Gestão',col:'--c3'},
{id:'D',name:'Follow-up programado',time:'Conforme combinado',col:'--c4'}];
const card=c=>`<div class="cat" style="--cc:var(${c.col})"><span class="code">${c.id}</span><b>${c.name}</b><div class="tm2"><small>Tempo do último diálogo</small><span class="${c.tbd?'tbd':''}">${c.time}</span></div></div>`;
$('#seq').innerHTML=CAT.slice(0,3).map((c,i)=>card(c)+(i<2?'<span class="arw">›</span>':'')).join('');
$('#dline').innerHTML='<div class="dl">Entrada própria</div>'+card(CAT[3]);
let cur=0;const slides=$$('.slide');
$('#dots').innerHTML=Array.from({length:TOTAL},(_,i)=>`<button class="dot" aria-label="Slide ${i+1}" data-go="${i}"></button>`).join('');
function ui(){
  slides.forEach((s,i)=>{s.classList.toggle('active',i===cur);s.classList.toggle('before',i<cur);if(i!==cur)s.setAttribute('aria-hidden','true');else s.removeAttribute('aria-hidden')});
  $('#counter').textContent=String(cur+1).padStart(2,'0')+' / '+String(TOTAL).padStart(2,'0');
  $('#prog').style.width=((cur+1)/TOTAL*100)+'%';
  $$('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
  $('#prev').disabled=cur===0;$('#next').disabled=cur===TOTAL-1;slides[cur].scrollTop=0;
}
function goTo(i){if(i<0||i>=TOTAL||i===cur)return;cur=i;ui()}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)goTo(+g.dataset.go)});
$('#prev').onclick=()=>goTo(cur-1);$('#next').onclick=()=>goTo(cur+1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();goTo(cur+1)}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();goTo(cur-1)}
  else if(e.key==='f'||e.key==='F'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(x){}}
});
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.6)goTo(cur+(dx<0?1:-1))},{passive:true});
ui();
</script>

</body>
</html>
